name: iOS strict-offline build

on:
  workflow_dispatch:
  push:
    branches:
      - "hardened/**"
      - "ci/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ios:
    name: iOS arm64 / Xcode 16.4
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CLICOLOR_FORCE: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALL_UPGRADE: "1"
      IOS_ARCH: arm64
      IOS_DEPLOYMENT_TARGET: "14.0"
      IOS_MARKETING_VERSION: v2026.07.1
      IOS_PLATFORM: iphoneos
      PARALLEL_JOBS: "4"
      AUDITED_PARENT_BASE: 9192014d8bd82a91dc1012473be0f238dedfdb54
      PINNED_BASE_COMMIT: 9f590b976790145eecf54fe2b0bcee114491d37e
      DERIVED_DATA: build/DerivedData

    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
          submodules: recursive

      - name: Prepare evidence directory
        run: mkdir -p artifacts/logs

      - name: Verify audited release base
        run: |
          git merge-base --is-ancestor "${AUDITED_PARENT_BASE}" HEAD
          git fetch --no-tags https://github.com/koreader/koreader.git \
            refs/tags/v2026.07.1:refs/tags/v2026.07.1
          test "$(git rev-parse 'refs/tags/v2026.07.1^{}')" = \
            "${AUDITED_PARENT_BASE}"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          sw_vers

      - name: Install prerequisites
        run: |
          packages=(
            autoconf
            automake
            bash
            binutils
            cmake
            coreutils
            findutils
            gettext
            gnu-getopt
            libtool
            make
            meson
            nasm
            ninja
            pkgconf
            util-linux
            xcodegen
          )
          brew install --formula --overwrite --quiet "${packages[@]}"

          prefix="$(brew --prefix)"
          {
            brew --version
            brew config
          } >artifacts/homebrew-environment.txt
          brew list --versions "${packages[@]}" | LC_ALL=C sort \
            >artifacts/homebrew-formulas.txt

          {
            echo "${prefix}/opt/findutils/libexec/gnubin"
            echo "${prefix}/opt/gettext/bin"
            echo "${prefix}/opt/gnu-getopt/bin"
            echo "${prefix}/opt/make/libexec/gnubin"
            echo "${prefix}/opt/util-linux/bin"
          } >>"${GITHUB_PATH}"

      - name: Verify prerequisites and pinned submodules
        run: |
          ./platform/ios/check-prereqs.sh
          make fetchthirdparty
          git submodule status --recursive | tee artifacts/submodules.txt
          test "$(git -C base rev-parse HEAD)" = "${PINNED_BASE_COMMIT}"
          ./platform/ios/check-source-invariants.sh | \
            tee artifacts/logs/source-invariants.log

      - name: Generate Xcode project
        run: |
          set -o pipefail
          make TARGET=ios xcodeproj 2>&1 | \
            tee artifacts/logs/make-ios.log
          test -f platform/ios/Info.plist
          ! grep -q '@VERSION@' platform/ios/Info.plist

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project KOReader.xcodeproj \
            -scheme KOReader \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build 2>&1 | tee artifacts/logs/xcodebuild-ios.log

      - name: Validate app bundle
        run: |
          exec > >(tee artifacts/logs/validate-bundle.log) 2>&1
          trap 'status=$?; echo "::error title=Bundle validation failed::${BASH_COMMAND} (exit ${status})"; exit "${status}"' ERR
          set -x

          app="${DERIVED_DATA}/Build/Products/Debug-iphoneos/KOReader.app"
          plist="${app}/Info.plist"

          require_arm64() {
            local binary="$1"
            local architectures
            architectures="$(lipo -archs "${binary}")"
            echo "${binary}: ${architectures}"
            if [ "${architectures}" != "arm64" ]; then
              echo "::error title=Unexpected architecture::${binary}: ${architectures}"
              return 1
            fi
          }

          test -x "${app}/KOReader"
          test -f "${app}/app/reader.lua"
          test -f "${app}/app/libs/libkoreader-monolibtic.dylib"
          test -f "${app}/app/libs/libluajit.dylib"
          test -f "${app}/app/libs/libSDL3.0.dylib"
          test -f "${app}/app/plugins/iosimporter.koplugin/main.lua"

          ./platform/ios/check-bundle-invariants.sh "${app}/app"

          plutil -lint "${plist}"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundleIdentifier' "${plist}")" = "rocks.koreader.ios"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundlePackageType' "${plist}")" = "APPL"
          version="$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundleShortVersionString' "${plist}")"
          test "${version}" = "2026.7.1"

          test "$(/usr/libexec/PlistBuddy -c \
            'Print :UIFileSharingEnabled' "${plist}")" = "false"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :LSSupportsOpeningDocumentsInPlace' "${plist}")" = "false"

          reject_plist_key() {
            local key="$1"
            if /usr/libexec/PlistBuddy -c "Print :${key}" "${plist}" \
                >/dev/null 2>&1; then
              echo "::error title=Forbidden Info.plist key::${key}"
              return 1
            fi
          }

          for key in \
            CFBundleDocumentTypes \
            CFBundleURLTypes \
            UIBackgroundModes \
            UISupportsDocumentBrowser \
            NSLocalNetworkUsageDescription \
            NSBonjourServices \
            NSAppTransportSecurity; do
            reject_plist_key "${key}"
          done

          test "$(plutil -convert json -o - \
            platform/ios/KOReader.entitlements)" = "{}"

          require_arm64 "${app}/KOReader"
          xcrun vtool -show-build "${app}/KOReader"
          otool -L "${app}/KOReader" | tee artifacts/linked-libraries.txt

          printf '%s\n' \
            _ko_ios_get_safe_area_pixels \
            _ko_ios_import_document_poll \
            _ko_ios_import_document_start \
            >artifacts/expected-main-exports.txt
          xcrun nm -gjU "${app}/KOReader" | LC_ALL=C sort -u \
            >artifacts/actual-main-exports.txt
          cmp artifacts/expected-main-exports.txt \
            artifacts/actual-main-exports.txt

          if find "${app}" -type l -print -quit | grep -q .; then
            echo "error: app bundle contains a symbolic link" >&2
            exit 1
          fi

          find "${app}" -type f -print0 | while IFS= read -r -d '' file; do
            if file -b "${file}" | grep -q 'Mach-O'; then
              printf '%s\n' "${file}"
            fi
          done >artifacts/macho-files.txt
          test -s artifacts/macho-files.txt

          : >artifacts/macho-dependencies.txt
          : >artifacts/macho-undefined-symbols.txt
          while IFS= read -r binary; do
            require_arm64 "${binary}"
            {
              echo "## ${binary}"
              otool -L "${binary}"
            } >>artifacts/macho-dependencies.txt
            xcrun nm -u "${binary}" 2>/dev/null | awk '{ print $NF }' \
              >>artifacts/macho-undefined-symbols.txt
            if [ "${binary}" != "${app}/KOReader" ]; then
              codesign --verify --strict "${binary}"
            fi
          done <artifacts/macho-files.txt

          LC_ALL=C sort -u -o artifacts/macho-undefined-symbols.txt \
            artifacts/macho-undefined-symbols.txt

          if grep -Ei \
              'lib(curl|ssl|crypto|tls|luasocket|luasec|zmq|czmq)|/(CF)?Network\.framework/' \
              artifacts/macho-dependencies.txt; then
            echo "::error title=Forbidden network dependency::A Mach-O links a network or TLS library"
            exit 1
          fi

          forbidden_symbols=(
            _accept _accept4 _bind _connect _freeaddrinfo _freeifaddrs
            _getaddrinfo _gethostbyaddr _gethostbyname _gethostbyname2
            _getifaddrs _getnameinfo _inet_addr _inet_aton _inet_ntoa
            _inet_ntop _inet_pton _listen _recv _recvfrom _recvmsg
            _res_query _send _sendmsg _sendto _shutdown _socket _socketpair
          )
          for symbol in "${forbidden_symbols[@]}"; do
            if grep -Fxq "${symbol}" artifacts/macho-undefined-symbols.txt; then
              echo "::error title=Forbidden network symbol::${symbol}"
              exit 1
            fi
          done

          if codesign -d --entitlements :- "${app}" \
              >artifacts/app-entitlements.plist \
              2>artifacts/app-codesign.txt; then
            plutil -lint artifacts/app-entitlements.plist
            test "$(plutil -convert json -o - \
              artifacts/app-entitlements.plist)" = "{}"
          else
            printf '%s\n' 'Unsigned app; SideStore supplies the final signature.' \
              >artifacts/app-entitlements.txt
          fi

          find "${app}" -type f -print | LC_ALL=C sort \
            >artifacts/bundle-files.txt
          {
            git rev-parse HEAD
            git submodule status --recursive
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
          } >artifacts/build-manifest.txt

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="${DERIVED_DATA}/Build/Products/Debug-iphoneos/KOReader.app"
          ipa_root="${RUNNER_TEMP}/koreader-ipa"
          ipa="${GITHUB_WORKSPACE}/artifacts/KOReader-${IOS_MARKETING_VERSION}-strict-offline-unsigned.ipa"

          mkdir -p "${ipa_root}/Payload"
          ditto "${app}" "${ipa_root}/Payload/KOReader.app"
          (
            cd "${ipa_root}"
            /usr/bin/zip -qry "${ipa}" Payload
          )

          test -s "${ipa}"
          unzip -t "${ipa}" | tee artifacts/logs/ipa-integrity.log
          unzip -Z1 "${ipa}" | awk '
            $0 != "Payload/" && $0 !~ /^Payload\/KOReader\.app\// {
              print
              bad = 1
            }
            END { exit bad }
          '
          shasum -a 256 "${ipa}" | tee artifacts/ipa-sha256.txt

      - name: Upload unsigned IPA and verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: koreader-ios-strict-offline-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: koreader-ios-strict-offline-failure-${{ github.sha }}
          path: artifacts/logs
          if-no-files-found: warn
          retention-days: 7
