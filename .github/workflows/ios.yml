name: iOS strict-offline build

on:
  workflow_dispatch:
  push:
    branches:
      - "hardened/**"
      - "ci/**"
      - ios-release
    tags:
      - "ios-v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ios:
    name: iOS arm64 / Xcode 16.4
    runs-on: macos-15
    timeout-minutes: 240
    env:
      CLICOLOR_FORCE: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALL_UPGRADE: "1"
      IOS_ARCH: arm64
      IOS_DEPLOYMENT_TARGET: "14.0"
      IOS_UPSTREAM_TAG: v2026.07.1
      IOS_PLATFORM: iphoneos
      PARALLEL_JOBS: "4"
      AUDITED_PARENT_BASE: 9192014d8bd82a91dc1012473be0f238dedfdb54
      PINNED_BASE_COMMIT: 1f6ec8e936ed07ee8a26007736931d3de0338258
      DERIVED_DATA: build/DerivedData

    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
          submodules: recursive

      - name: Prepare evidence directory
        run: mkdir -p artifacts/logs

      - name: Verify release metadata and event
        run: |
          set -euo pipefail
          metadata_tag="$(ruby -rjson -e \
            'puts JSON.parse(File.read("platform/ios/release.json")).fetch("releaseTag")')"
          metadata_version="$(ruby -rjson -e \
            'puts JSON.parse(File.read("platform/ios/release.json")).fetch("marketingVersion")')"
          metadata_build="$(ruby -rjson -e \
            'puts JSON.parse(File.read("platform/ios/release.json")).fetch("buildVersion")')"
          metadata_upstream="$(ruby -rjson -e \
            'puts JSON.parse(File.read("platform/ios/release.json")).fetch("upstreamTag")')"

          test "${metadata_upstream}" = "${IOS_UPSTREAM_TAG}"
          test "${metadata_tag}" = "ios-v${metadata_version}-b${metadata_build}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            test "${GITHUB_REF_NAME}" = "${metadata_tag}"
            test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = \
              "${GITHUB_SHA}"
          fi

      - name: Test app source publication tools
        run: |
          ruby Scripts/test_sidestore_source.rb
          ruby Scripts/validate_sidestore_source.rb \
            --history-only \
            --allow-empty-template

      - name: Verify audited release base
        run: |
          git merge-base --is-ancestor "${AUDITED_PARENT_BASE}" HEAD
          git fetch --no-tags https://github.com/koreader/koreader.git \
            "refs/tags/${IOS_UPSTREAM_TAG}:refs/tags/${IOS_UPSTREAM_TAG}"
          test "$(git rev-parse "refs/tags/${IOS_UPSTREAM_TAG}^{}")" = \
            "${AUDITED_PARENT_BASE}"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          sw_vers

      - name: Install prerequisites
        run: |
          packages=(
            autoconf
            automake
            bash
            binutils
            cmake
            coreutils
            findutils
            gettext
            gnu-getopt
            libtool
            make
            meson
            nasm
            ninja
            pkgconf
            sdl3
            util-linux
            xcodegen
          )
          brew install --formula --overwrite --quiet "${packages[@]}"

          prefix="$(brew --prefix)"
          {
            brew --version
            brew config
          } >artifacts/homebrew-environment.txt
          brew list --versions "${packages[@]}" | LC_ALL=C sort \
            >artifacts/homebrew-formulas.txt

          {
            echo "${prefix}/opt/findutils/libexec/gnubin"
            echo "${prefix}/opt/gettext/bin"
            echo "${prefix}/opt/gnu-getopt/bin"
            echo "${prefix}/opt/make/libexec/gnubin"
            echo "${prefix}/opt/util-linux/bin"
          } >>"${GITHUB_PATH}"

      - name: Verify prerequisites and pinned submodules
        run: |
          ./platform/ios/check-prereqs.sh
          make fetchthirdparty
          git submodule status --recursive | tee artifacts/submodules.txt
          test "$(git -C base rev-parse HEAD)" = "${PINNED_BASE_COMMIT}"
          ./platform/ios/check-source-invariants.sh | \
            tee artifacts/logs/source-invariants.log

      - name: Test Mach-O closure verifier
        run: |
          ./platform/ios/test-macho-closure.sh 2>&1 | \
            tee artifacts/logs/macho-closure-tests.log

      - name: Run release-gating frontend tests
        timeout-minutes: 90
        run: |
          set -o pipefail
          targeted_runner="${PWD}/platform/ios/run-targeted-front-tests.sh"
          hardened_runner="${PWD}/platform/ios/run-hardened-front-tests.sh"
          host_make=(
            make
            TARGET=macos
            OUTPUT_DIR=build/host
            INSTALL_DIR=install/host
            PARALLEL_JOBS="${PARALLEL_JOBS}"
          )

          "${host_make[@]}" all 2>&1 | \
            tee artifacts/logs/build-front-test-host.log
          runtime_revision="$(cat install/host/koreader/git-rev)"
          echo "KOReader runtime revision: ${runtime_revision}"
          if [[ ! "${runtime_revision}" =~ ^v[0-9]{4}\.[0-9]{2}([.-]|$) ]]; then
            echo "::error title=Invalid KOReader runtime revision::git-rev must use the upstream vYYYY.MM schema, got ${runtime_revision}"
            exit 1
          fi

          for spec in \
            spec/front/unit/safesettings_spec.lua \
            spec/front/unit/dispatcher_spec.lua \
            spec/front/unit/readerfont_spec.lua \
            spec/front/unit/readerui_spec.lua \
            spec/front/unit/sdl3_finger_slots_spec.lua \
            spec/front/unit/sdl_touch_cancel_spec.lua \
            spec/front/unit/ios_system_appearance_spec.lua; do
            "${host_make[@]}" testfront RUNTESTS="${targeted_runner}" T="${spec}" \
              2>&1 | tee "artifacts/logs/$(basename "${spec}" .lua).log"
          done

          for spec in \
            spec/front/unit/docsettings_hardened_ios_spec.lua \
            spec/front/unit/filemanagerutil_ios_spec.lua \
            spec/front/unit/iosimporter_spec.lua \
            spec/front/unit/writable_lua_hardened_ios_spec.lua; do
            "${host_make[@]}" testfront RUNTESTS="${hardened_runner}" T="${spec}" \
              2>&1 | tee "artifacts/logs/$(basename "${spec}" .lua).log"
          done

          "${host_make[@]}" testfront 2>&1 | \
            tee artifacts/logs/testfront.log

      - name: Generate Xcode project
        run: |
          set -o pipefail
          make TARGET=ios xcodeproj 2>&1 | \
            tee artifacts/logs/make-ios.log
          test -f platform/ios/Info.plist
          ! grep -q '@VERSION@' platform/ios/Info.plist

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project KOReader.xcodeproj \
            -scheme KOReader \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_DEBUG_DYLIB=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build 2>&1 | tee artifacts/logs/xcodebuild-ios.log

      - name: Validate app bundle
        run: |
          exec > >(tee artifacts/logs/validate-bundle.log) 2>&1
          trap 'status=$?; echo "::error title=Bundle validation failed::${BASH_COMMAND} (exit ${status})"; exit "${status}"' ERR
          set -x

          app="${DERIVED_DATA}/Build/Products/Debug-iphoneos/KOReader.app"
          plist="${app}/Info.plist"

          require_arm64() {
            local binary="$1"
            local architectures
            architectures="$(lipo -archs "${binary}")"
            echo "${binary}: ${architectures}"
            if [ "${architectures}" != "arm64" ]; then
              echo "::error title=Unexpected architecture::${binary}: ${architectures}"
              return 1
            fi
          }

          test -x "${app}/KOReader"
          if find "${app}" -type f -name '*.debug.dylib' -print -quit | grep -q .; then
            echo "error: Xcode debug dylib split is enabled" >&2
            exit 1
          fi
          test -f "${app}/app/reader.lua"
          test -f "${app}/app/libs/libkoreader-monolibtic.dylib"
          test -f "${app}/app/libs/libluajit.dylib"
          test -f "${app}/app/libs/libSDL3.0.dylib"
          test -f "${app}/app/plugins/iosimporter.koplugin/main.lua"
          test -f "${app}/app/plugins/iossystemappearance.koplugin/main.lua"

          ./platform/ios/check-bundle-invariants.sh "${app}/app"

          plutil -lint "${plist}"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundleIdentifier' "${plist}")" = "rocks.koreader.ios"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundlePackageType' "${plist}")" = "APPL"
          version="$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundleShortVersionString' "${plist}")"
          build_version="$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundleVersion' "${plist}")"
          metadata_version="$(ruby -rjson -e \
            'puts JSON.parse(File.read("platform/ios/release.json")).fetch("marketingVersion")')"
          metadata_build="$(ruby -rjson -e \
            'puts JSON.parse(File.read("platform/ios/release.json")).fetch("buildVersion")')"
          test "${version}" = "${metadata_version}"
          test "${build_version}" = "${metadata_build}"

          test "$(/usr/libexec/PlistBuddy -c \
            'Print :UIFileSharingEnabled' "${plist}")" = "false"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :LSSupportsOpeningDocumentsInPlace' "${plist}")" = "true"

          reject_plist_key() {
            local key="$1"
            if /usr/libexec/PlistBuddy -c "Print :${key}" "${plist}" \
                >/dev/null 2>&1; then
              echo "::error title=Forbidden Info.plist key::${key}"
              return 1
            fi
          }

          for key in \
            CFBundleDocumentTypes \
            CFBundleURLTypes \
            UIBackgroundModes \
            UISupportsDocumentBrowser \
            NSLocalNetworkUsageDescription \
            NSBonjourServices \
            NSAppTransportSecurity; do
            reject_plist_key "${key}"
          done

          test "$(plutil -convert json -o - \
            platform/ios/KOReader.entitlements)" = "{}"

          require_arm64 "${app}/KOReader"
          xcrun vtool -show-build "${app}/KOReader"
          otool -L "${app}/KOReader" | tee artifacts/linked-libraries.txt

          printf '%s\n' \
            __mh_execute_header \
            _ko_ios_get_safe_area_pixels \
            _ko_ios_import_document_poll \
            _ko_ios_import_document_start \
            _ko_ios_system_appearance_current \
            _ko_ios_system_appearance_event_type \
            _ko_ios_system_appearance_start \
            >artifacts/expected-main-exports.txt
          xcrun nm -gjU "${app}/KOReader" | LC_ALL=C sort -u \
            >artifacts/main-global-defined-symbols.txt
          xcrun dyld_info -exports "${app}/KOReader" | \
            tee artifacts/main-export-trie.txt
          awk '
            $1 ~ /^0x[[:xdigit:]]+$/ { print $2; next }
            $1 == "[re-export]" { print $2 }
          ' artifacts/main-export-trie.txt | LC_ALL=C sort -u \
            >artifacts/actual-main-exports.txt
          test -s artifacts/actual-main-exports.txt
          cmp artifacts/expected-main-exports.txt \
            artifacts/actual-main-exports.txt

          if find "${app}" -type l -print -quit | grep -q .; then
            echo "error: app bundle contains a symbolic link" >&2
            exit 1
          fi

          find "${app}" -type f -print0 | while IFS= read -r -d '' file; do
            if file -b "${file}" | grep -q 'Mach-O'; then
              printf '%s\n' "${file}"
            fi
          done >artifacts/macho-files.txt
          test -s artifacts/macho-files.txt

          : >artifacts/macho-dependencies.txt
          : >artifacts/macho-undefined-symbols.txt
          while IFS= read -r binary; do
            require_arm64 "${binary}"
            {
              echo "## ${binary}"
              otool -L "${binary}"
            } >>artifacts/macho-dependencies.txt
            xcrun nm -u "${binary}" 2>/dev/null | awk '{ print $NF }' \
              >>artifacts/macho-undefined-symbols.txt
            if [ "${binary}" != "${app}/KOReader" ]; then
              codesign --verify --strict "${binary}"
            fi
          done <artifacts/macho-files.txt

          LC_ALL=C sort -u -o artifacts/macho-undefined-symbols.txt \
            artifacts/macho-undefined-symbols.txt

          ./platform/ios/check-macho-closure.sh "${app}" | \
            tee artifacts/macho-closure.txt

          if grep -Ei \
              'lib(curl|ssl|crypto|tls|luasocket|luasec|zmq|czmq|gio|glib|gmodule|gobject)|/(CF)?Network\.framework/' \
              artifacts/macho-dependencies.txt; then
            echo "::error title=Forbidden network dependency::A Mach-O links a network or TLS library"
            exit 1
          fi

          forbidden_symbols=(
            _accept _accept4 _bind _connect _freeaddrinfo _freeifaddrs
            _getaddrinfo _gethostbyaddr _gethostbyname _gethostbyname2
            _getifaddrs _getnameinfo _inet_addr _inet_aton _inet_ntoa
            _inet_ntop _inet_pton _listen _recv _recvfrom _recvmsg
            _res_query _send _sendmsg _sendto _shutdown _socket _socketpair
          )
          for symbol in "${forbidden_symbols[@]}"; do
            if grep -Fxq "${symbol}" artifacts/macho-undefined-symbols.txt; then
              echo "::error title=Forbidden network symbol::${symbol}"
              exit 1
            fi
          done

          if codesign -d --entitlements :- "${app}" \
              >artifacts/app-entitlements.plist \
              2>artifacts/app-codesign.txt; then
            plutil -lint artifacts/app-entitlements.plist
            test "$(plutil -convert json -o - \
              artifacts/app-entitlements.plist)" = "{}"
          else
            printf '%s\n' 'Unsigned app; SideStore supplies the final signature.' \
              >artifacts/app-entitlements.txt
          fi

          find "${app}" -type f -print | LC_ALL=C sort \
            >artifacts/bundle-files.txt
          {
            git rev-parse HEAD
            git submodule status --recursive
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
          } >artifacts/build-manifest.txt

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="${DERIVED_DATA}/Build/Products/Debug-iphoneos/KOReader.app"
          ipa_root="${RUNNER_TEMP}/koreader-ipa"
          ipa="${GITHUB_WORKSPACE}/artifacts/KOReader-Strict-Offline-SideStore.ipa"

          mkdir -p "${ipa_root}/Payload"
          ditto "${app}" "${ipa_root}/Payload/KOReader.app"
          (
            cd "${ipa_root}"
            /usr/bin/zip -qry "${ipa}" Payload
          )

          test -s "${ipa}"
          unzip -t "${ipa}" | tee artifacts/logs/ipa-integrity.log
          unzip -Z1 "${ipa}" | awk '
            $0 != "Payload/" && $0 !~ /^Payload\/KOReader\.app\// {
              print
              bad = 1
            }
            END { exit bad }
          '
          verify_root="${RUNNER_TEMP}/koreader-ipa-verification"
          mkdir -p "${verify_root}"
          unzip -q "${ipa}" -d "${verify_root}"
          extracted_app="${verify_root}/Payload/KOReader.app"
          ./platform/ios/check-bundle-invariants.sh "${extracted_app}/app"
          ./platform/ios/check-macho-closure.sh "${extracted_app}" | \
            tee artifacts/logs/ipa-macho-closure.log
          if find "${extracted_app}" -type l -print -quit | grep -q .; then
            echo "error: packaged IPA contains a symbolic link" >&2
            exit 1
          fi
          cmp "${app}/KOReader" "${extracted_app}/KOReader"

          (
            cd "$(dirname "${ipa}")"
            shasum -a 256 "$(basename "${ipa}")" \
              >KOReader-Strict-Offline-SideStore.ipa.sha256
          )
          cat artifacts/KOReader-Strict-Offline-SideStore.ipa.sha256

      - name: Validate the release source candidate
        if: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          candidate="${RUNNER_TEMP}/sidestore-source.json"
          cp sidestore-source.json "${candidate}"
          tag="$(ruby -rjson -e \
            'puts JSON.parse(File.read("platform/ios/release.json")).fetch("releaseTag")')"
          description="$(ruby -rjson -e \
            'puts JSON.parse(File.read("platform/ios/release.json")).fetch("localizedDescription")')"
          release_date="$(git show -s --format=%cs HEAD)"
          ruby Scripts/update_sidestore_source.rb \
            --source "${candidate}" \
            --ipa "artifacts/KOReader-Strict-Offline-SideStore.ipa" \
            --tag "${tag}" \
            --date "${release_date}" \
            --description "${description}"
          ruby Scripts/validate_sidestore_source.rb \
            --source "${candidate}" \
            --ipa "artifacts/KOReader-Strict-Offline-SideStore.ipa" \
            --sha256-file \
              "artifacts/KOReader-Strict-Offline-SideStore.ipa.sha256" \
            --tag "${tag}"
          cp "${candidate}" artifacts/sidestore-source-candidate.json

      - name: Upload unsigned IPA and verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: koreader-ios-strict-offline-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: koreader-ios-strict-offline-failure-${{ github.sha }}
          path: artifacts/logs
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish verified IPA and app source
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: ios
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: koreader-ios-release-publication
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      IPA_NAME: KOReader-Strict-Offline-SideStore.ipa
      SHA_NAME: KOReader-Strict-Offline-SideStore.ipa.sha256
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_BRANCH: ios-release

    steps:
      - name: Download the tested artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: koreader-ios-strict-offline-${{ github.sha }}
          path: release-artifact

      - name: Checkout exact release sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}
          path: tag-source

      - name: Checkout publication branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_BRANCH }}
          path: source-update

      - name: Verify exact tag, metadata, checksum, and IPA plist
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error title=Release input verification failed::${BASH_COMMAND} (exit ${status})"; exit "${status}"' ERR

          metadata="tag-source/platform/ios/release.json"
          ipa="release-artifact/${IPA_NAME}"
          checksum="release-artifact/${SHA_NAME}"
          test -f "${metadata}"
          test -s "${ipa}"
          test -s "${checksum}"
          test "$(find release-artifact -type f -name "${IPA_NAME}" | wc -l)" -eq 1
          test "$(find release-artifact -type f -name "${SHA_NAME}" | wc -l)" -eq 1

          metadata_tag="$(jq -er '.releaseTag' "${metadata}")"
          metadata_version="$(jq -er '.marketingVersion' "${metadata}")"
          metadata_build="$(jq -er '.buildVersion' "${metadata}")"
          metadata_upstream="$(jq -er '.upstreamTag' "${metadata}")"
          metadata_channel="$(jq -er '.channel' "${metadata}")"
          test "${RELEASE_TAG}" = "${metadata_tag}"
          test "${metadata_tag}" = "ios-v${metadata_version}-b${metadata_build}"
          [[ "${metadata_tag}" =~ ^ios-v[0-9]+\.[0-9]+\.[0-9]+-b[1-9][0-9]*$ ]]
          [[ "${metadata_upstream}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "${metadata_channel}" = beta || "${metadata_channel}" = stable ]]

          git -C tag-source fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git -C tag-source rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(git -C tag-source rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = \
            "${RELEASE_SHA}"

          (
            cd release-artifact
            sha256sum -c "${SHA_NAME}"
          )

          python3 - "${ipa}" release-artifact/ipa-metadata.json <<'PY'
          import json
          import plistlib
          import sys
          import zipfile

          ipa_path, output_path = sys.argv[1:]
          plist_path = "Payload/KOReader.app/Info.plist"
          with zipfile.ZipFile(ipa_path) as archive:
              names = archive.namelist()
              if names.count(plist_path) != 1:
                  raise SystemExit("IPA must contain exactly one KOReader Info.plist")
              plist = plistlib.loads(archive.read(plist_path))

          metadata = {
              "bundleIdentifier": plist.get("CFBundleIdentifier"),
              "marketingVersion": plist.get("CFBundleShortVersionString"),
              "buildVersion": plist.get("CFBundleVersion"),
              "minimumOSVersion": plist.get("MinimumOSVersion"),
          }
          with open(output_path, "w", encoding="utf-8") as output:
              json.dump(metadata, output, sort_keys=True)
              output.write("\n")
          PY

          jq -e \
            --arg version "${metadata_version}" \
            --arg build "${metadata_build}" \
            '.bundleIdentifier == "rocks.koreader.ios" and
             .marketingVersion == $version and
             .buildVersion == $build and
             .minimumOSVersion == "14.0"' \
            release-artifact/ipa-metadata.json

      - name: Preflight the live source branch handoff
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error title=Source handoff preflight failed::${BASH_COMMAND} (exit ${status})"; exit "${status}"' ERR
          metadata="tag-source/platform/ios/release.json"
          description="$(jq -er '.localizedDescription' "${metadata}")"
          candidate="release-artifact/source-handoff-candidate.json"

          git -C source-update fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git -C source-update fetch --no-tags origin \
            "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          source_head="$(git -C source-update rev-parse \
            "refs/remotes/origin/${SOURCE_BRANCH}")"
          test "$(git -C source-update rev-parse \
            "refs/tags/${RELEASE_TAG}^{commit}")" = "${RELEASE_SHA}"
          if git -C source-update merge-base --is-ancestor \
              "${source_head}" "${RELEASE_SHA}"; then
            :
          elif git -C source-update merge-base --is-ancestor \
              "${RELEASE_SHA}" "${source_head}"; then
            :
          else
            echo "${SOURCE_BRANCH} and ${RELEASE_TAG} have diverged" >&2
            exit 1
          fi

          git -C source-update show \
            "${source_head}:sidestore-source.json" >"${candidate}"
          ruby tag-source/Scripts/update_sidestore_source.rb \
            --source "${candidate}" \
            --metadata "${metadata}" \
            --ipa "release-artifact/${IPA_NAME}" \
            --tag "${RELEASE_TAG}" \
            --date "$(date -u +%F)" \
            --description "${description}"
          ruby tag-source/Scripts/validate_sidestore_source.rb \
            --source "${candidate}" \
            --metadata "${metadata}" \
            --ipa "release-artifact/${IPA_NAME}" \
            --sha256-file "release-artifact/${SHA_NAME}" \
            --tag "${RELEASE_TAG}"
          printf '%s\n' "${source_head}" \
            >release-artifact/source-preflight-head.txt

      - name: Create or verify the permanent GitHub Release
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error title=GitHub Release publication failed::${BASH_COMMAND} (exit ${status})"; exit "${status}"' ERR

          metadata="tag-source/platform/ios/release.json"
          ipa="release-artifact/${IPA_NAME}"
          checksum="release-artifact/${SHA_NAME}"
          version="$(jq -er '.marketingVersion' "${metadata}")"
          channel="$(jq -er '.channel' "${metadata}")"
          description="$(jq -er '.localizedDescription' "${metadata}")"
          ipa_sha256="$(sha256sum "${ipa}" | awk '{print $1}')"
          expected_prerelease=false
          if [ "${channel}" = beta ]; then
            expected_prerelease=true
          fi
          release_name="KOReader ${version} strict-offline iOS"
          release_body="$(printf '%s\n\nUnsigned arm64 IPA for SideStore or LiveContainer self-signing. Minimum iOS/iPadOS: 14.0.\n\nSHA-256: `%s`' \
            "${description}" "${ipa_sha256}")"

          release_matches="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -s --arg tag "${RELEASE_TAG}" \
                '[.[][] | select(.tag_name == $tag)]'
          )"
          release_count="$(jq 'length' <<<"${release_matches}")"
          if [ "${release_count}" -gt 1 ]; then
            echo "Multiple releases unexpectedly use ${RELEASE_TAG}" >&2
            exit 1
          fi

          if [ "${release_count}" -eq 0 ]; then
            release_json="$(gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${RELEASE_TAG}" \
              -f target_commitish="${RELEASE_SHA}" \
              -f name="${release_name}" \
              -f body="${release_body}" \
              -F draft=true \
              -F prerelease="${expected_prerelease}")"
          else
            release_json="$(jq '.[0]' <<<"${release_matches}")"
          fi

          test "$(jq -r '.tag_name' <<<"${release_json}")" = "${RELEASE_TAG}"
          test "$(jq -r '.name' <<<"${release_json}")" = "${release_name}"
          test "$(jq -r '.body' <<<"${release_json}")" = "${release_body}"
          test "$(jq -r '.prerelease' <<<"${release_json}")" = "${expected_prerelease}"
          release_id="$(jq -er '.id' <<<"${release_json}")"
          [[ "${release_id}" =~ ^[1-9][0-9]*$ ]]

          authenticated_asset_matches() {
            local json="$1"
            local name="$2"
            jq --arg name "${name}" '[.assets[] | select(.name == $name)]' <<<"${json}"
          }

          ensure_asset() {
            local name="$1"
            local path="$2"
            local matches count asset_id asset_state temporary upload_url
            matches="$(authenticated_asset_matches "${release_json}" "${name}")"
            count="$(jq 'length' <<<"${matches}")"
            if [ "${count}" -gt 1 ]; then
              echo "Release has duplicate ${name} assets" >&2
              return 1
            fi
            if [ "${count}" -eq 0 ] && \
                [ "$(jq -r '.draft' <<<"${release_json}")" != true ]; then
              echo "Published Release is missing immutable asset ${name}" >&2
              return 1
            fi
            if [ "${count}" -eq 1 ]; then
              asset_id="$(jq -er '.[0].id' <<<"${matches}")"
              asset_state="$(jq -er '.[0].state' <<<"${matches}")"
              if [ "${asset_state}" = uploaded ]; then
                temporary="$(mktemp)"
                gh api \
                  -H 'Accept: application/octet-stream' \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >"${temporary}"
                if cmp -s "${path}" "${temporary}"; then
                  rm -f "${temporary}"
                  return 0
                fi
                rm -f "${temporary}"
                if [ "$(jq -r '.draft' <<<"${release_json}")" != true ]; then
                  echo "Published ${name} differs from the tested file" >&2
                  return 1
                fi
              elif [ "$(jq -r '.draft' <<<"${release_json}")" != true ]; then
                echo "Published ${name} has incomplete state ${asset_state}" >&2
                return 1
              fi
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
              release_json="$(gh api \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
            fi

            upload_url="$(jq -er '.upload_url | sub("\\{.*$"; "")' <<<"${release_json}")"
            test "${upload_url}" = \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets"
            gh api \
              --method POST \
              -H 'Content-Type: application/octet-stream' \
              --input "${path}" \
              "${upload_url}?name=${name}" >/dev/null
            release_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          }

          unexpected_assets="$(jq \
            --arg ipa "${IPA_NAME}" \
            --arg checksum "${SHA_NAME}" \
            '[.assets[].name | select(. != $ipa and . != $checksum)]' \
            <<<"${release_json}")"
          test "$(jq 'length' <<<"${unexpected_assets}")" -eq 0
          ensure_asset "${IPA_NAME}" "${ipa}"
          ensure_asset "${SHA_NAME}" "${checksum}"
          release_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"

          test "$(jq '.assets | length' <<<"${release_json}")" -eq 2
          for asset_name in "${IPA_NAME}" "${SHA_NAME}"; do
            matches="$(authenticated_asset_matches "${release_json}" "${asset_name}")"
            test "$(jq 'length' <<<"${matches}")" -eq 1
            test "$(jq -r '.[0].state' <<<"${matches}")" = uploaded
            asset_id="$(jq -er '.[0].id' <<<"${matches}")"
            downloaded="$(mktemp)"
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >"${downloaded}"
            if [ "${asset_name}" = "${IPA_NAME}" ]; then
              cmp "${ipa}" "${downloaded}"
            else
              cmp "${checksum}" "${downloaded}"
            fi
            rm -f "${downloaded}"
          done

          git -C tag-source fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git -C tag-source rev-parse \
            "refs/tags/${RELEASE_TAG}^{commit}")" = "${RELEASE_SHA}"
          expected_source_head="$(cat \
            release-artifact/source-preflight-head.txt)"
          git -C source-update fetch --no-tags origin \
            "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          test "$(git -C source-update rev-parse \
            "refs/remotes/origin/${SOURCE_BRANCH}")" = \
            "${expected_source_head}"

          if [ "$(jq -r '.draft' <<<"${release_json}")" = true ]; then
            release_json="$(gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false)"
          fi
          test "$(jq -r '.draft' <<<"${release_json}")" = false
          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            >release-artifact/github-release.json

      - name: Verify the anonymous public Release downloads
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error title=Public Release verification failed::${BASH_COMMAND} (exit ${status})"; exit "${status}"' ERR
          mkdir -p public
          release_json="release-artifact/github-release.json"
          test "$(jq -r '.tag_name' "${release_json}")" = "${RELEASE_TAG}"
          test "$(jq -r '.draft' "${release_json}")" = false
          test "$(jq -r '.immutable' "${release_json}")" = true
          test "$(jq '.assets | length' "${release_json}")" -eq 2

          for asset_name in "${IPA_NAME}" "${SHA_NAME}"; do
            url="$(jq -er --arg name "${asset_name}" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              "${release_json}")"
            curl --fail --location --silent --show-error \
              --retry 8 --retry-all-errors --retry-delay 3 \
              "${url}" -o "public/${asset_name}"
          done

          cmp "release-artifact/${IPA_NAME}" "public/${IPA_NAME}"
          cmp "release-artifact/${SHA_NAME}" "public/${SHA_NAME}"
          (
            cd public
            sha256sum -c "${SHA_NAME}"
          )

      - name: Publish source metadata after the public IPA gate
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error title=App source publication failed::${BASH_COMMAND} (exit ${status})"; exit "${status}"' ERR
          metadata="tag-source/platform/ios/release.json"
          description="$(jq -er '.localizedDescription' "${metadata}")"
          release_date="$(jq -er '.published_at[0:10]' \
            release-artifact/github-release.json)"

          git -C source-update fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git -C source-update fetch --no-tags origin \
            "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          git -C source-update checkout -B "${SOURCE_BRANCH}" \
            "refs/remotes/origin/${SOURCE_BRANCH}"
          test "$(git -C source-update rev-parse \
            "refs/tags/${RELEASE_TAG}^{commit}")" = "${RELEASE_SHA}"
          source_head="$(git -C source-update rev-parse HEAD)"
          if [ "${source_head}" = "${RELEASE_SHA}" ]; then
            :
          elif git -C source-update merge-base --is-ancestor \
              "${source_head}" "${RELEASE_SHA}"; then
            git -C source-update merge --ff-only "${RELEASE_SHA}"
          elif git -C source-update merge-base --is-ancestor \
              "${RELEASE_SHA}" "${source_head}"; then
            echo "Source branch already contains ${RELEASE_TAG}."
          else
            echo "${SOURCE_BRANCH} and ${RELEASE_TAG} have diverged" >&2
            exit 1
          fi

          ruby tag-source/Scripts/update_sidestore_source.rb \
            --source source-update/sidestore-source.json \
            --metadata "${metadata}" \
            --ipa "public/${IPA_NAME}" \
            --tag "${RELEASE_TAG}" \
            --date "${release_date}" \
            --description "${description}"
          ruby tag-source/Scripts/validate_sidestore_source.rb \
            --source source-update/sidestore-source.json \
            --metadata "${metadata}" \
            --ipa "public/${IPA_NAME}" \
            --sha256-file "public/${SHA_NAME}" \
            --tag "${RELEASE_TAG}"

          git -C source-update config user.name github-actions[bot]
          git -C source-update config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git -C source-update add sidestore-source.json
          if git -C source-update diff --cached --quiet; then
            echo "Source already contains ${RELEASE_TAG}."
          else
            staged_paths="$(git -C source-update diff --cached --name-only)"
            test "${staged_paths}" = sidestore-source.json
            git -C source-update diff --cached --check
            git -C source-update commit -m \
              "chore(ios): publish ${RELEASE_TAG} app source"
            git -C source-update push origin \
              "HEAD:refs/heads/${SOURCE_BRANCH}"
          fi

          source_sha="$(git -C source-update rev-parse HEAD)"
          git -C source-update fetch --no-tags origin \
            "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          test "$(git -C source-update rev-parse \
            "refs/remotes/origin/${SOURCE_BRANCH}")" = "${source_sha}"
          printf '%s\n' "${source_sha}" >release-artifact/source-sha.txt

      - name: Verify the canonical public app source
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error title=Public app source verification failed::${BASH_COMMAND} (exit ${status})"; exit "${status}"' ERR
          source_sha="$(cat release-artifact/source-sha.txt)"
          source_url="$(jq -er '.sourceURL' source-update/sidestore-source.json)"
          icon_url="$(jq -er '.iconURL' source-update/sidestore-source.json)"
          public_source="public/sidestore-source.json"

          matched=false
          for attempt in $(seq 1 12); do
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 2 \
              "${source_url}?commit=${source_sha}" -o "${public_source}"
            if cmp -s source-update/sidestore-source.json "${public_source}"; then
              matched=true
              break
            fi
            echo "Public source has not reached ${source_sha}; retry ${attempt}/12"
            sleep 5
          done
          test "${matched}" = true

          ruby tag-source/Scripts/validate_sidestore_source.rb \
            --source "${public_source}" \
            --metadata tag-source/platform/ios/release.json \
            --ipa "public/${IPA_NAME}" \
            --sha256-file "public/${SHA_NAME}" \
            --tag "${RELEASE_TAG}"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            "${icon_url}?commit=${source_sha}" -o public/AppIcon.png
          test -s public/AppIcon.png
          test "$(head -c 8 public/AppIcon.png | od -An -tx1 | tr -d ' \n')" = \
            89504e470d0a1a0a

          ipa_sha256="$(sha256sum "public/${IPA_NAME}" | awk '{print $1}')"
          {
            echo "### Published strict-offline iOS release"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Source commit: \`${source_sha}\`"
            echo "- IPA size: \`$(stat -c '%s' "public/${IPA_NAME}")\` bytes"
            echo "- IPA SHA-256: \`${ipa_sha256}\`"
            echo "- Source: \`${source_url}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
