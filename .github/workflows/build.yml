name: macos

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on: [push, pull_request, workflow_dispatch]

defaults:
  run:
    shell: bash

jobs:

  macos:

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: '15'
            platform: 'x86-64'
            xcode_version: '16.4'
            deployment_target: '10.15'
            jobs: 5
          - image: '15'
            platform: 'ARM64'
            xcode_version: '16.4'
            deployment_target: '11.0'
            jobs: 4

    name: "macOS ${{ matrix.image }} ${{ matrix.platform }} 🔨${{ matrix.xcode_version }} 🎯${{ matrix.deployment_target }}"

    runs-on: "macos-${{ matrix.image }}${{ matrix.platform == 'x86-64' && '-intel' || '' }}"

    env:
      # Bump first number to reset all caches.
      CACHE_KEY: "1-macOS-${{ matrix.image }}-${{ matrix.platform }}-XC${{ matrix.xcode_version }}-DT${{ matrix.deployment_target }}"
      CLICOLOR_FORCE: '1'
      KODEBUG: ""
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      MAKEFLAGS: OUTPUT_DIR=build PARALLEL_JOBS=${{ matrix.jobs }} INSTALL_DIR=install TARGET=macos

    steps:

      # Install dependencies. {{{

      - name: XCode version
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode_version }}.app
          xcodebuild -version
          xcode-select -p

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -x
          python3 -m pip install --disable-pip-version-check meson ruamel.yaml
          wget -O ninjatracing.zip https://github.com/cradleapps/ninjatracing/archive/084212eaf68f25c70579958a2ed67fb4ec2a9ca4.zip
          unzip -j ninjatracing.zip '*/ninjatracing'
          install -m755 ninjatracing /usr/local/bin/
          rm ninjatracing*
          # Install brew packages.
          packages=(
            autoconf
            automake
            bash
            binutils
            coreutils
            findutils
            libtool
            make
            nasm
            ninja
            pkg-config
            util-linux
          )
          # Don't auto-update.
          export HOMEBREW_NO_AUTO_UPDATE=1
          # Don't upgrade already installed formulas.
          export HOMEBREW_NO_INSTALL_UPGRADE=1
          # Remove some installed packages to prevent brew
          # from attempting (and failing) to upgrade them.
          brew uninstall gradle maven
          brew install --formula --overwrite --quiet "${packages[@]}"

      - name: Update PATH
        run: >
          printf '%s\n'
          "$(brew --prefix)/opt/findutils/libexec/gnubin"
          "$(brew --prefix)/opt/make/libexec/gnubin"
          "$(brew --prefix)/opt/util-linux/bin"
          | tee "${GITHUB_PATH}"

      # }}}

      # Checkout / fetch. {{{

      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 0
          filter: tree:0
          show-progress: false

      - name: Fetch
        run: make fetchthirdparty

      # }}}

      - name: Generate cache key
        run: make TARGET= cache-key

      - name: Restore build directory
        id: build-restore
        uses: actions/cache/restore@v5
        with:
          path: build
          key: ${{ env.CACHE_KEY }}-build-${{ hashFiles('cache-key') }}

      # Restore / setup build cache. {{{

      - name: Lookup or restore build cache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: /Users/runner/Library/Caches/ccache
          key: ${{ env.CACHE_KEY }}-ccache-${{ hashFiles('cache-key') }}
          restore-keys: ${{ env.CACHE_KEY }}-ccache-
          # When not building, do a lookup so the cache
          # does not get removed after 7 days with no use.
          lookup-only: ${{ steps.build-restore.outputs.cache-hit }}

      - name: Install ccache
        if: steps.build-restore.outputs.cache-hit != 'true'
        run: |
          wget --progress=dot:mega https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-darwin.tar.gz
          tar xf ccache-4.10.2-darwin.tar.gz
          printf '%s\n' "$PWD/ccache-4.10.2-darwin" >>"${GITHUB_PATH}"

      - name: Setup build cache
        if: steps.build-restore.outputs.cache-hit != 'true'
        run: |
          set -x
          which ccache
          ccache --version
          ccache --zero-stats
          ccache --max-size=256M
          ccache --show-config

      # }}}

      # Build. {{{

      - name: Build
        id: build
        if: steps.build-restore.outputs.cache-hit != 'true'
        run: make base

      - name: Dump build timings
        if: contains('failure success', steps.build.conclusion) && !cancelled()
        run: make buildstats

      # }}}

      # Clean / save build cache. {{{

      - name: Clean caches
        if: contains('failure success', steps.build.conclusion) && !cancelled()
        run: |
          set -x
          # Trim the build directory.
          rm -rf build/{cmake,staging,thirdparty}
          ccache --cleanup >/dev/null
          ccache --show-stats --verbose

      - name: Save build cache
        uses: actions/cache/save@v5
        if: steps.build-restore.outputs.cache-hit != 'true' && steps.ccache-restore.outputs.cache-hit != 'true'
        with:
          path: /Users/runner/Library/Caches/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      # }}}

      # Dump & check binaries. {{{

      - name: Dump binaries runtime path & dependencies
        run: make bininfo

      - name: Checking binaries for missing dependencies
        run: make bincheck

      # }}}

      - name: Save build directory
        uses: actions/cache/save@v5
        if: steps.build-restore.outputs.cache-hit != 'true'
        with:
          path: build
          key: ${{ steps.build-restore.outputs.cache-primary-key }}

      - name: Test hardened settings loader
        timeout-minutes: 15
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          targeted_runner="${PWD}/platform/ios/run-targeted-front-tests.sh"
          ./base/utils/fake_tty.py make --assume-old=base testfront \
            RUNTESTS="${targeted_runner}" T=spec/front/unit/safesettings_spec.lua \
            2>&1 | tee artifacts/logs/safesettings.log

      - name: Test hardened iOS data boundaries
        timeout-minutes: 20
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          hardened_runner="${PWD}/platform/ios/run-hardened-front-tests.sh"
          for spec in \
            spec/front/unit/docsettings_hardened_ios_spec.lua \
            spec/front/unit/filemanagerutil_ios_spec.lua \
            spec/front/unit/writable_lua_hardened_ios_spec.lua; do
            ./base/utils/fake_tty.py make --assume-old=base testfront \
              RUNTESTS="${hardened_runner}" T="${spec}" \
              2>&1 | tee "artifacts/logs/$(basename "${spec}" .lua).log"
          done

      - name: Test
        id: testfront
        run: |
          mkdir -p artifacts/logs
          set +e
          ./base/utils/fake_tty.py make --assume-old=base testfront 2>&1 | \
            tee artifacts/logs/testfront.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            summary="$(grep -m1 -E '(^Failure|^Error|_spec\.lua:[0-9]+:)' \
              artifacts/logs/testfront.log || true)"
            if [ -z "${summary}" ]; then
              summary="testfront exited with status ${status}"
            fi
            summary="${summary//'%'/'%25'}"
            echo "::error title=Frontend tests failed::${summary}"
            exit "${status}"
          fi

      - name: Upload frontend test failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-test-failure-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/logs
          if-no-files-found: warn
          retention-days: 7

      # Generate / upload artifact. {{{

      - name: Generate artifact
        # Note: ensure the build skeleton is created, so there are no dangling
        # symlinks (e.g. `data/dict`) to trip 7zip during artifact generation…
        run: make skeleton update --assume-old=base

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: '*.7z'

      # }}}

# vim: foldmethod=marker foldlevel=0
